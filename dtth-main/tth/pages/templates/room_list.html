<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Room List</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            background: url('https://www.shutterstock.com/shutterstock/videos/1080564710/thumb/1.jpg?ip=x480') no-repeat center center/cover;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-attachment: fixed;
        }

        h1 {
            margin-top: 40px;
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.7);
            font-size: 3rem;
        }

        .room-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            padding: 40px;
            width: 100%;
            max-width: 1200px;
        }

        .room-card {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.3);
            text-align: center;
            transition: transform 0.3s;
        }

        .room-card:hover {
            transform: translateY(-8px);
        }

        .room-card h3 {
            color: #333;
            margin-bottom: 10px;
        }

        .room-card p {
            font-size: 16px;
            color: #555;
            margin-bottom: 20px;
        }

        .room-card a {
    text-decoration: none;
    background-color: rgba(0, 0, 0, 0.7); /* Black with 70% opacity */
    color: white;
    padding: 10px 20px;
    border-radius: 6px;
    font-weight: bold;
    transition: background 0.3s;
}

.room-card a:hover {
    background-color: rgba(0, 0, 0, 0.9); /* Darker on hover */
}
    </style>
</head>
<body>

    <h1>Available Rooms</h1>

    <div class="room-grid">
    {% for room in rooms %}
        <div class="room-card">
            <h3>{{ room.name }}</h3>
            <p>Capacity: {{ room.capacity }}</p>
            <a href="{% url 'make_reservation' room.id %}">Make Reservation</a>
        </div>
    {% empty %}
        <div class="room-card">
            <p>No rooms available.</p>
        </div>
    {% endfor %}
    </div>

</body>
</html>
