<style>
    body {
        margin: 0;
        padding: 0;
        font-family: 'Poppins', sans-serif;
        background: url('https://c4.wallpaperflare.com/wallpaper/312/29/300/nature-beach-sunset-walkway-wallpaper-preview.jpg') no-repeat center/cover;

        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .box {
        background: rgba(255, 255, 255, 0.95);
        padding: 40px 60px;
        border-radius: 15px;
        box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        text-align: center;
        width: 90%;
        max-width: 600px;
    }

    h1 {
        color: #ff238d;
        margin-bottom: 20px;
    }

    form {
        display: flex;
        flex-direction: column;
        align-items: stretch;
    }

    label {
        text-align: left;
        margin: 10px 0 5px;
        font-weight: 600;
        color: #333;
    }

    input[type="text"],
    input[type="email"],
    input[type="date"],
    input[type="number"] {
        padding: 12px;
        border: 1px solid #ccc;
        border-radius: 5px;
        margin-bottom: 15px;
        font-size: 16px;
    }

    input[type="submit"] {
        background-color: #ff238d;
        color: white;
        padding: 14px;
        border: none;
        border-radius: 5px;
        font-size: 18px;
        cursor: pointer;
        transition: 0.3s;
        margin-top: 10px;
    }

    input[type="submit"]:hover {
        background-color: #e0117f;
    }
</style>
<div>---
<div class="box">
  <h1>Book Tour - {{ tour.name }}</h1>
  <form method="post">
    {% csrf_token %}
    <label for="name">Name:</label>
    <input type="text" name="name" required>

    <label for="email">Email:</label>
    <input type="email" name="email" required>

    <label for="phone">Phone:</label>
    <input type="text" name="phone" required>

    <label for="date">Date:</label>
    <input type="date" name="date" required>

    <label for="num_people">Number of People:</label>
    <input type="number" name="num_people" min="1" max="10" required>

    <input type="submit" value="Book Now">
  </form>
    <h3> To go back <a href="/">Click here</a>
</h3>
</div>
</div>
