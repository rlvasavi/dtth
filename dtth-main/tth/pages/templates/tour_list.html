<center><h1>Available Tours</h1></center>

<div class="cards">
  {% for tour in tours %}
  <div class="card">
    <div class="container">
      <h2>{{ tour.name }}</h2>
      <p>{{ tour.description }}</p>
      <p><strong>Price:</strong> ₹{{ tour.price }}</p>
      <hr>
      <a href="{% url 'book_tour' tour.id %}" class="button button5">Book Now</a>
    </div>
  </div>
  {% endfor %}
</div>

<style>
body {
  font-family: 'Poppins', sans-serif;
  margin: 0;
  padding: 20px;
 background: url('https://c4.wallpaperflare.com/wallpaper/126/71/622/a-night-on-the-beach-brown-wooden-beach-houses-wallpaper-preview.jpg') no-repeat center/cover;
  min-height: 100vh;
}

h1 {
  margin: 20px 0;
  color: #ffff;
}

.cards {
  max-width: 1200px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 2rem;
  padding: 20px;
}

.card {
  background: #f1eeeb;
  border-radius: 10px;
  overflow: hidden;
  box-shadow: 0 6px 15px rgba(0,0,0,0.1);
  transition: transform 0.3s, box-shadow 0.3s;
}

.card:hover {
  transform: translateY(-8px);
  box-shadow: 0 10px 20px rgba(0,0,0,0.2);
}

.container {
  padding: 20px;
  text-align: center;
}

.container h2 {
  font-size: 24px;
  margin-bottom: 10px;
  color: #ff2352;
}

.container p {
  font-size: 16px;
  color: #555;
  margin: 8px 0;
}

hr {
  margin: 20px 0;
  border: 0;
  height: 1px;
  background: #eee;
}

.button {
  background-color: #4CAF50;
  border: none;
  color: white;
  padding: 10px 24px;
  text-align: center;
  text-decoration: none;
  font-size: 16px;
  border-radius: 5px;
  transition: 0.3s;
  display: inline-block;
}

.button5 {
  background-color: white;
  color: black;
  border: 2px solid #555;
}

.button5:hover {
  background-color: #555;
  color: white;
}
</style>
